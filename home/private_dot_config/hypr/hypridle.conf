# hypridle — idle daemon (FreeBSD/Hyprland).
#
# FreeBSD has no systemd-logind, so the dbus lock/sleep hooks the upstream
# sample relies on (loginctl / systemctl) are unavailable. Idle locking here is
# driven purely by the compositor's ext-idle-notify-v1 timeouts below.
# Docs: https://wiki.hyprland.org/Hypr-Ecosystem/hypridle

general {
    lock_cmd = pgrep -x hyprlock || hyprlock   # guard against duplicate lockers
    ignore_dbus_inhibit = false
}

# Lock after 5 minutes idle.
listener {
    timeout = 300
    on-timeout = pgrep -x hyprlock || hyprlock
}

# Blank displays 30s after locking; restore on activity.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
